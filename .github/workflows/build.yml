name: Build Android APK (KitKat 4.4+)

on:
  push:
    branches: [ kitkat-legacy, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Otomatis menyimpan cache dependensi Gradle

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Bounce-Classic-v1.1-KitKat.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bounce-Classic-v1.1-KitKat
          path: app/build/outputs/apk/debug/Bounce-Classic-v1.1-KitKat.apk
